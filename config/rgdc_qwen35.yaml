# RGDC run of the paper: the ten source corpora with a Qwen3.5-4B scorer
name: rgdc_qwen35

# Phase 1A: Pre-Experience Sampling
phase1a:
  source_data_dir: data/source/pool
  template_filter: mid_zero-shot
  base_model: Qwen/Qwen3.5-4B
  max_samples_per_corpus: 20000
  kmeans_clusters: 100
  samples_per_cluster: 10
  low_th: 25
  up_th: 75
  max_length: 1024
  seed: 42
  output_dir: data/rgdc_qwen35/pre_experience
  output_concat: data/rgdc_qwen35/pre_experience_concat.json

# Phase 1B: Pre-Experienced Model, trained in LLaMA-Factory with
# config/training/phase1b_pre_experience_qwen35_4b.yaml
phase1b:
  base_model: Qwen/Qwen3.5-4B
  training_data: data/rgdc_qwen35/pre_experience_concat.json
  trained_model_path: training/LlamaFactory/saves/Qwen3.5-4B/freeze/pre_experience

# Phase 1C: IFD Cherry Selection
phase1c:
  source_data_dir: data/source/pool
  template_filter: mid_zero-shot
  pre_exp_model: training/LlamaFactory/saves/Qwen3.5-4B/freeze/pre_experience
  max_length: 1024
  batch_size: 128
  sample_rate: 0.10
  prompt: alpaca
  output_dir: data/rgdc_qwen35/cherry
  output_concat: data/rgdc_qwen35/cherry_concat.json

# Phase 2: Constraint Augmentation
phase2:
  input_file: data/rgdc_qwen35/cherry_concat.json
  output_dir: data/rgdc_qwen35/phase2
  llm_model: Qwen/Qwen3.5-35B-A3B-FP8
  api_base_url: https://<your-vllm-endpoint>
  api_key: <your-api-key>
  temperature_constraint_gen: 0.7
  temperature_eval_ques_gen: 0.0
  temperature_inference: 0.7
  temperature_evaluation: 0.0
  min_sample_constraints: 1
  max_sample_constraints: 3
  seed: 42
  filter_mode: all_pass
  include_failed: true
  max_concurrent: 28
  batch_size: 16
  delay: 0.1
  max_retries: 5
